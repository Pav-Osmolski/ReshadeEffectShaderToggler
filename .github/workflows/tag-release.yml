name: Tag Release

on:
  workflow_run:
    workflows: [MSBuild]
    types: [completed]
    branches: [main]

concurrency:
  group: tag-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define REST_VERSION_STRING "\([^"]*\)"/\1/p' src/version.h)"
          tag="v${version}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.680$ ]] || { echo "Invalid modern release version" >&2; exit 1; }
          [[ "${COMMIT_MESSAGE%%$'\n'*}" == "Release $tag" ]] || { echo "Release title/version mismatch" >&2; exit 1; }
          test -f "docs/releases/${tag}.md"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" == "$RELEASE_SHA" ]] || { echo "Existing tag points to another commit" >&2; exit 1; }
          else
            git tag "${tag}" "$RELEASE_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; assets remain immutable."
            exit 0
          fi
          # GITHUB_TOKEN tag pushes do not trigger the publisher, so dispatch it.
          gh workflow run release.yml --ref "$tag"
