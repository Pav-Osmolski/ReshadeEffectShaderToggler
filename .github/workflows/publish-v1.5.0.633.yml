name: Publish v1.5.0.633

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.5.0.633.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: 0b44148b8bb71938114017f2958fbba4c324e1d9
          submodules: recursive
          fetch-depth: 0

      - name: Validate release source
        shell: pwsh
        run: |
          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          if (-not $match.Matches.Success) { throw "Could not read REST_VERSION_STRING." }
          if ($match.Matches[0].Groups[1].Value -ne "1.5.0.633") { throw "Unexpected release version." }
          if (-not (Select-String -Path "./README.md" -Pattern "REST Enhanced — ReShade Effect Shader Toggler" -Quiet)) { throw "REST Enhanced branding is missing." }
          if (-not (Select-String -Path "./README.md" -Pattern "DeViLhoOD" -Quiet)) { throw "README credit for DeViLhoOD is missing." }

      - name: Verify immutable tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v1.5.0.633"
          $expected = "0b44148b8bb71938114017f2958fbba4c324e1d9"
          $existing = gh api "repos/$repo/git/ref/tags/$tag" | ConvertFrom-Json
          if ($existing.object.sha -ne $expected) {
            throw "Tag $tag points to $($existing.object.sha), expected $expected."
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        run: msbuild /m /property:Platform=x64 /p:Configuration=Release src/ReshadeEffectShaderToggler.sln

      - name: Build x86
        run: msbuild /m /property:Platform=x86 /p:Configuration=Release src/ReshadeEffectShaderToggler.sln

      - name: Validate x86/x64 binaries
        shell: pwsh
        run: |
          $x86 = "src/Win32/Release/ReshadeEffectShaderToggler.addon32"
          $x64 = "src/x64/Release/ReshadeEffectShaderToggler.addon64"

          function Get-PeMachine([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$Path does not contain a valid PE signature." }
              return $reader.ReadUInt16()
            }
            finally { $stream.Dispose() }
          }

          if ((Get-PeMachine $x86) -ne 0x014c) { throw "addon32 is not an i386/PE32 binary." }
          if ((Get-PeMachine $x64) -ne 0x8664) { throw "addon64 is not an AMD64/PE32+ binary." }

          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "Could not locate dumpbin.exe." }

          foreach ($binary in @($x86, $x64)) {
            $fileVersion = (Get-Item $binary).VersionInfo.FileVersion
            if ($fileVersion -ne $version) { throw "$binary reports version $fileVersion; expected $version." }
            $exports = (& $dumpbin /nologo /exports $binary | Out-String)
            foreach ($requiredExport in @("NAME", "DESCRIPTION")) {
              if ($exports -notmatch "(?i)\b$requiredExport\b") { throw "$binary is missing required export $requiredExport." }
            }
          }

      - name: Package release
        shell: pwsh
        run: |
          $paths = @(
            "src/x64/Release/ReshadeEffectShaderToggler.addon64",
            "src/Win32/Release/ReshadeEffectShaderToggler.addon32",
            "LICENSE",
            "README.md",
            "Shaders",
            "docs"
          )
          Compress-Archive -Path $paths -DestinationPath "release.zip" -Force
          $hash = (Get-FileHash "release.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  release.zip" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          Major quality-of-life release introducing the **REST Enhanced — ReShade Effect Shader Toggler** identity while preserving the established repository, binary and INI filenames for compatibility.

          ## Highlights

          - Adds deterministic **Saved / Unsaved changes** tracking and a clearer **Save changes** workflow.
          - Adds safe **Clone** and confirmed **Delete** group actions.
          - Adds compact PS / VS / CS / FX group summaries and Auto Scene Colour status.
          - Adds shader-hash search plus **All / Marked / Unmarked** filtering.
          - Adds mouse controls for previous/next/marked shader navigation and mark/unmark.
          - Adds **Recollect** across pixel, vertex and compute shader stages while retaining marked hashes.
          - Restores functional configurable shader-hunting and group toggle hotkeys with exact Ctrl/Shift/Alt matching.
          - Adds optional compute-shader hunting bindings.
          - Adds shortcut-conflict warnings.
          - Hides inherited Invocation/Descriptor keybinding controls that have no execution path while preserving their saved INI values.
          - Widens the default shader-hunting pane for complete hash visibility while retaining the adjustable splitter.
          - Hardens marked-shader navigation when no shader is currently selected.
          - Improves Auto Scene Colour status with clearer injection/native-staging reporting and **Copy diagnostics**.
          - Persists overlay opacity and shader-collection frame count.
          - Uses game-agnostic Graphics API labels (D3D10, D3D11, D3D12) while retaining BG3 DX11 + DLSS as the documented primary regression reference.
          - Keeps the D3D10/D3D11/D3D12 Auto Scene Colour rendering architecture unchanged from the validated v1.4 path.

          Improvements by **DeViLhoOD**.
          '@ | Set-Content -Path "release-notes.md" -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v1.5.0.633"
          gh release view "$tag" --repo "$repo" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite it." }
          gh release create "$tag" "release.zip" "SHA256SUMS.txt" --repo "$repo" --verify-tag --title "$tag" --notes-file "release-notes.md"
