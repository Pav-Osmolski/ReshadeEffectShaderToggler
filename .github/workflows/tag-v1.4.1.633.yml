name: Tag v1.4.1.633

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tag-v1.4.1.633.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/v1.4.1.633" -f sha="2c2d3fa53a67240057acfcfb7dddfe0891487e24"
