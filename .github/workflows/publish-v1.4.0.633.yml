name: Publish v1.4.0.633

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.4.0.633.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: e57ac84512a30a4bec4c651aa6ddfdb4726b0e18
          submodules: recursive
          fetch-depth: 0

      - name: Validate release source
        shell: pwsh
        run: |
          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          if (-not $match.Matches.Success) { throw "Could not read REST_VERSION_STRING." }
          if ($match.Matches[0].Groups[1].Value -ne "1.4.0.633") { throw "Unexpected release version." }
          if (-not (Select-String -Path "./README.md" -Pattern "DeViLhoOD" -Quiet)) { throw "README credit for DeViLhoOD is missing." }

      - name: Create tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/v1.4.0.633" -f sha="e57ac84512a30a4bec4c651aa6ddfdb4726b0e18"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        run: msbuild /m /property:Platform=x64 /p:Configuration=Release src/ReshadeEffectShaderToggler.sln

      - name: Build x86
        run: msbuild /m /property:Platform=x86 /p:Configuration=Release src/ReshadeEffectShaderToggler.sln

      - name: Package release
        shell: pwsh
        run: |
          $paths = @(
            "src/x64/Release/ReshadeEffectShaderToggler.addon64",
            "src/Win32/Release/ReshadeEffectShaderToggler.addon32",
            "LICENSE",
            "README.md",
            "Shaders",
            "docs"
          )
          Compress-Archive -Path $paths -DestinationPath "release.zip" -Force
          $hash = (Get-FileHash "release.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  release.zip" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.4.0.633" "release.zip" "SHA256SUMS.txt" --repo "${{ github.repository }}" --target "e57ac84512a30a4bec4c651aa6ddfdb4726b0e18" --title "v1.4.0.633" --verify-tag --notes "Automatic Scene Colour for D3D12 upscaled rendering, including DLSS/native-staging support, multi-pass technique fixes, diagnostics, documentation and release hardening. Improvements by DeViLhoOD. Validated in Baldur's Gate 3 with D3D12 + DLSS, including Lumenite_Kernel -> Lumenite_LSAO rendering beneath the UI."
