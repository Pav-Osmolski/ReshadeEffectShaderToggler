name: Workflow checks

on:
  push:
    branches: [main, legacy/reshade-5.x]
    paths: [".github/workflows/**", "scripts/**"]
  pull_request:
    branches: [main, legacy/reshade-5.x]
    types: [opened, reopened, ready_for_review]
    paths: [".github/workflows/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate workflow structure
        run: python scripts/validate-workflows.py
      - name: Parse PowerShell scripts and workflow steps
        shell: pwsh
        run: ./scripts/validate-powershell.ps1
      - name: Release routing regression tests
        run: python -m unittest discover -s tests -p test_release_workflow.py
