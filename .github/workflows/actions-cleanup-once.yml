name: One-time Actions cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions-cleanup-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed and cancelled workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const doomed = runs.filter(run =>
              run.status === 'completed' &&
              (run.conclusion === 'failure' || run.conclusion === 'cancelled')
            );

            core.info(`Found ${doomed.length} failed/cancelled workflow runs to delete.`);

            let deleted = 0;
            for (const run of doomed) {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id
              });
              deleted++;
              if (deleted % 25 === 0 || deleted === doomed.length) {
                core.info(`Deleted ${deleted}/${doomed.length} runs.`);
              }
            }

            core.notice(`Deleted ${deleted} failed/cancelled workflow runs. Successful runs were preserved.`);
