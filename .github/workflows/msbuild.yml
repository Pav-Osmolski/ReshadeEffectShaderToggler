name: MSBuild

# Validate final PR review events and maintained-branch pushes; WIP stays quiet.
on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "deps/**"
      - "Shaders/**"
      - ".gitmodules"
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/**"
      - "docs/releases/**"
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: msbuild-${{ startsWith(github.event.head_commit.message, 'Release v') && 'release' || 'validation' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

env:
  SOLUTION_FILE_PATH: src/ReshadeEffectShaderToggler.sln
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select validation scope
        id: scope
        run: python scripts/ci-scope.py

      - name: Fetch native dependencies
        if: steps.scope.outputs.native == 'true'
        run: git submodule update --init --recursive

      - name: Validate version tooling
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        run: |
          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          if (-not $match.Matches.Success) {
            throw "Could not read REST_VERSION_STRING from src/version.h."
          }
          $version = $match.Matches[0].Groups[1].Value
          ./src/set_release_version.ps1 "v$version"
          $stamped = Get-Content "./src/version.h" -Raw
          $expected = '#define REST_VERSION_STRING "' + $version + '"'
          if (-not $stamped.Contains($expected)) {
            throw "Version stamping validation failed."
          }

      - name: Install workflow validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate workflows and PowerShell
        shell: pwsh
        run: |
          python scripts/validate-workflows.py
          if ($LASTEXITCODE -ne 0) { throw "Workflow validation failed." }
          ./scripts/validate-powershell.ps1
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Release routing regression failed." }

      - name: Add MSBuild to PATH
        if: steps.scope.outputs.native == 'true'
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        if: steps.scope.outputs.native == 'true'
        run: msbuild /m /property:Platform=x64 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Build x86
        if: steps.scope.outputs.native == 'true'
        run: msbuild /m /property:Platform=x86 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Rendering safety regression tests
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        run: ./scripts/test-rendering-safety.ps1

      - name: Validate x86/x64 binaries
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        run: ./scripts/validate-binaries.ps1

      - name: Package runtime test candidate
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        run: ./scripts/package-test-build.ps1

      - name: Upload build artifacts
        if: steps.scope.outputs.native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: REST-build-${{ github.sha }}
          path: |
            test-package/*.zip
            test-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  tag:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'legacy/reshade-5.x') &&
      startsWith(github.event.head_commit.message, 'Release v')
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define REST_VERSION_STRING "\([^"]*\)"/\1/p' src/version.h)"
          tag="v${version}"
          case "$RELEASE_BRANCH" in
            main) suffix=680 ;;
            legacy/reshade-5.x) suffix=580 ;;
            *) echo "Unsupported release branch" >&2; exit 1 ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.${suffix}$ ]] || { echo "Invalid release version for branch" >&2; exit 1; }
          [[ "${COMMIT_MESSAGE%%$'\n'*}" == "Release $tag" ]] || { echo "Release title/version mismatch" >&2; exit 1; }
          test -f "docs/releases/${tag}.md"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$RELEASE_BRANCH"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" == "$RELEASE_SHA" ]] || { echo "Existing tag points to another commit" >&2; exit 1; }
          else
            git tag "${tag}" "$RELEASE_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; assets remain immutable."
            exit 0
          fi
          # GITHUB_TOKEN tag pushes do not trigger the publisher, so dispatch it.
          gh workflow run release.yml --ref "$tag"
