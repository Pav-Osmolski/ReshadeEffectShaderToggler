name: MSBuild

# CI is deliberately lifecycle-based rather than commit-based:
# - validate a PR once when it is opened/marked ready;
# - validate the merged result on main;
# - use workflow_dispatch for any explicit WIP/test build.
#
# We intentionally do not run on pull_request "synchronize", because that
# creates an Actions run for every WIP commit pushed to an open PR.
on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "deps/**"
      - ".gitmodules"
      - ".github/workflows/msbuild.yml"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - "deps/**"
      - ".gitmodules"
      - ".github/workflows/msbuild.yml"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: src/ReshadeEffectShaderToggler.sln
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate version tooling
        shell: pwsh
        run: |
          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          if (-not $match.Matches.Success) {
            throw "Could not read REST_VERSION_STRING from src/version.h."
          }
          $version = $match.Matches[0].Groups[1].Value
          ./src/set_release_version.ps1 "v$version"
          $stamped = Get-Content "./src/version.h" -Raw
          $expected = '#define REST_VERSION_STRING "' + $version + '"'
          if (-not $stamped.Contains($expected)) {
            throw "Version stamping validation failed."
          }

      - name: Install workflow validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate workflows and PowerShell
        shell: pwsh
        run: |
          python scripts/validate-workflows.py
          if ($LASTEXITCODE -ne 0) { throw "Workflow validation failed." }
          ./scripts/validate-powershell.ps1
          python -m unittest discover -s tests -p test_release_workflow.py
          if ($LASTEXITCODE -ne 0) { throw "Release routing regression failed." }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        run: msbuild /m /property:Platform=x64 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Build x86
        run: msbuild /m /property:Platform=x86 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Rendering safety regression tests
        shell: pwsh
        run: ./scripts/test-rendering-safety.ps1

      - name: Validate x86/x64 binaries
        shell: pwsh
        run: ./scripts/validate-binaries.ps1

      - name: Package runtime test candidate
        shell: pwsh
        run: ./scripts/package-test-build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: REST-build-${{ github.sha }}
          path: |
            test-package/*.zip
            test-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
