name: Release

on:
  push:
    tags:
      - "v*.*.*.*"

env:
  SOLUTION_FILE_PATH: src/ReshadeEffectShaderToggler.sln
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate tag and source version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH.RESHADE format, for example v1.4.3.633."
          }

          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          if (-not $match.Matches.Success) {
            throw "Could not read REST_VERSION_STRING from src/version.h."
          }

          $sourceVersion = $match.Matches[0].Groups[1].Value
          if ($tag -ne "v$sourceVersion") {
            throw "Release tag $tag does not match committed source version v$sourceVersion."
          }

          ./src/set_release_version.ps1 $tag
          Get-Content ./src/version.h

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        run: msbuild /m /property:Platform=x64 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Build x86
        run: msbuild /m /property:Platform=x86 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Validate x86/x64 binaries
        shell: pwsh
        run: |
          $x86 = "src/Win32/Release/ReshadeEffectShaderToggler.addon32"
          $x64 = "src/x64/Release/ReshadeEffectShaderToggler.addon64"

          function Get-PeMachine([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "$Path does not contain a valid PE signature."
              }
              return $reader.ReadUInt16()
            }
            finally {
              $stream.Dispose()
            }
          }

          if ((Get-PeMachine $x86) -ne 0x014c) {
            throw "addon32 is not an i386/PE32 binary."
          }
          if ((Get-PeMachine $x64) -ne 0x8664) {
            throw "addon64 is not an AMD64/PE32+ binary."
          }

          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw "Could not locate dumpbin.exe in the Visual Studio toolchain."
          }

          foreach ($binary in @($x86, $x64)) {
            $fileVersion = (Get-Item $binary).VersionInfo.FileVersion
            if ($fileVersion -ne $version) {
              throw "$binary reports version $fileVersion; expected $version."
            }

            $exports = (& $dumpbin /nologo /exports $binary | Out-String)
            foreach ($requiredExport in @("NAME", "DESCRIPTION")) {
              if ($exports -notmatch "(?i)\b$requiredExport\b") {
                throw "$binary is missing required export $requiredExport."
              }
            }
          }

      - name: Package release
        shell: pwsh
        run: |
          $paths = @(
            "src/x64/Release/ReshadeEffectShaderToggler.addon64",
            "src/Win32/Release/ReshadeEffectShaderToggler.addon32",
            "LICENSE",
            "README.md",
            "Shaders",
            "docs"
          )
          Compress-Archive -Path $paths -DestinationPath "release.zip" -Force
          $hash = (Get-FileHash "release.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  release.zip" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "release.zip" "SHA256SUMS.txt" --verify-tag --title "${{ github.ref_name }}" --generate-notes
