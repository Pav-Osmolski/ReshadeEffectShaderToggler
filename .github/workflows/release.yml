name: Release

on:
  push:
    tags:
      - "v*.*.*.*"
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: src/ReshadeEffectShaderToggler.sln
  BUILD_CONFIGURATION: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate tag and source version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+\.580$') {
            throw "Legacy release tags must use vMAJOR.MINOR.PATCH.580 for the ReShade 5.x maintenance line."
          }

          $match = Select-String -Path "./src/version.h" -Pattern 'REST_VERSION_STRING "([^"]+)"'
          if (-not $match.Matches.Success) {
            throw "Could not read REST_VERSION_STRING from src/version.h."
          }

          $sourceVersion = $match.Matches[0].Groups[1].Value
          if ($tag -ne "v$sourceVersion") {
            throw "Release tag $tag does not match committed source version v$sourceVersion."
          }

          if (-not (Test-Path "docs/releases/$tag.md")) {
            throw "Missing committed release notes: docs/releases/$tag.md"
          }

          git merge-base --is-ancestor HEAD origin/legacy/reshade-5.x
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit merged into legacy/reshade-5.x."
          }

          ./src/set_release_version.ps1 $tag
          Get-Content ./src/version.h

      - name: Install workflow validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate workflows and PowerShell
        shell: pwsh
        run: |
          python scripts/validate-workflows.py
          if ($LASTEXITCODE -ne 0) { throw "Workflow validation failed." }
          ./scripts/validate-powershell.ps1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        run: msbuild /m /property:Platform=x64 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Build x86
        run: msbuild /m /property:Platform=x86 /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Rendering safety regression tests
        shell: pwsh
        run: ./scripts/test-rendering-safety.ps1

      - name: Validate x86/x64 binaries
        shell: pwsh
        run: ./scripts/validate-binaries.ps1

      - name: Package release
        shell: pwsh
        run: |
          $paths = @(
            "src/x64/Release/ReshadeEffectShaderToggler.addon64",
            "src/Win32/Release/ReshadeEffectShaderToggler.addon32",
            "LICENSE",
            "README.md",
            "CHANGELOG.md",
            "Shaders",
            "docs"
          )
          Compress-Archive -Path $paths -DestinationPath "release.zip" -Force
          $hash = (Get-FileHash "release.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  release.zip" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Existing releases are immutable: retries must never replace assets.
          gh release create $env:RELEASE_TAG "release.zip" "SHA256SUMS.txt" --verify-tag --latest=false --title "$env:RELEASE_TAG (Legacy / ReShade 5.x)" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; existing releases are never overwritten." }
